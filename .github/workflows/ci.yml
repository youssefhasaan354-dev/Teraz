name: CI / Quality Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_FIREBASE_API_KEY: ci_placeholder_key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-teraz.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-teraz
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-teraz.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef"
          REVALIDATION_SECRET: ci_secret_token
