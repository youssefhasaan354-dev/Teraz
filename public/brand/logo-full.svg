<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9B97E" />
      <stop offset="50%" stop-color="#B38B54" />
      <stop offset="100%" stop-color="#8F6D3C" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1C1512" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Icon Mark: Serif T + Gold Swoosh + Luxury Chair -->
  <g transform="translate(40, 20)">
    <!-- Base Gold Ground Line -->
    <line x1="10" y1="135" x2="120" y2="135" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Large Serif Capital 'T' in Espresso-Black -->
    <path d="M 30,35 L 100,35 L 100,45 L 72,45 L 72,125 L 78,127 L 78,133 L 52,133 L 52,127 L 58,125 L 58,45 L 30,45 Z" fill="#1C1512" />
    
    <!-- Curved Brushed-Gold Swoosh Arc Crossing 'T' -->
    <path d="M 15,90 Q 65,40 125,75 Q 85,95 25,115" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#softShadow)" />

    <!-- Minimal Modern Armchair Icon at base of T -->
    <g transform="translate(75, 96) scale(0.7)">
      <!-- Chair Backrest -->
      <path d="M 10,10 C 10,2 30,2 30,10 L 30,32 C 30,35 27,38 20,38 C 13,38 10,35 10,32 Z" fill="#1C1512" />
      <!-- Chair Armrests -->
      <path d="M 4,20 C 4,16 9,16 9,20 L 9,33 C 9,35 6,37 4,37 C 2,37 4,34 4,33 Z" fill="url(#goldGrad)" />
      <path d="M 31,20 C 31,16 36,16 36,20 L 36,33 C 36,35 34,37 36,37 C 38,37 31,34 31,33 Z" fill="url(#goldGrad)" />
      <!-- Chair Legs -->
      <line x1="8" y1="38" x2="4" y2="52" stroke="#1C1512" stroke-width="2" stroke-linecap="round" />
      <line x1="32" y1="38" x2="36" y2="52" stroke="#1C1512" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Typography Block -->
  <g transform="translate(190, 50)">
    <!-- Teraz Brand Name (High-Contrast Elegant Serif) -->
    <text x="0" y="55" font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="54" font-weight="700" letter-spacing="1.5" fill="#1C1512">
      Teraz
    </text>

    <!-- Arabic Calligraphic / Kufic Complement -->
    <text x="180" y="55" font-family="'Cairo', 'Amiri', 'Traditional Arabic', sans-serif" font-size="46" font-weight="700" fill="#B38B54">
      طِـــرَاز
    </text>

    <!-- Thin Gold Hairline & FURNITURE -->
    <g transform="translate(0, 75)">
      <line x1="0" y1="-5" x2="55" y2="-5" stroke="url(#goldGrad)" stroke-width="1.5" />
      <text x="70" y="0" font-family="'Inter', 'Montserrat', sans-serif" font-size="13" font-weight="600" letter-spacing="8" fill="#1C1512">
        FURNITURE &amp; KITCHENS
      </text>
      <line x1="285" y1="-5" x2="340" y2="-5" stroke="url(#goldGrad)" stroke-width="1.5" />
    </g>

    <!-- LIVE IN ELEGANCE (Arabic & English Tagline) -->
    <g transform="translate(0, 98)">
      <text x="2" y="0" font-family="'Inter', 'Montserrat', sans-serif" font-size="10.5" font-weight="400" letter-spacing="5" fill="#8A7762">
        LIVE IN ELEGANCE
      </text>
      <circle cx="165" cy="-3.5" r="2" fill="#B38B54" />
      <text x="180" y="0" font-family="'Cairo', sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" fill="#8A7762">
        عِــــش الأنَـــاقَــــة
      </text>
    </g>
  </g>
</svg>
